<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
  <title id="t">Aamir Ullah, full-stack developer</title>
  <desc id="d">Animated hero banner with name, rotating role, tech stack and a code card.</desc>

  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="gm" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1000" height="400" fill="url(#gm)"/></mask>
    <clipPath id="frame"><rect width="1000" height="400" rx="20"/></clipPath>

    <linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="640" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F5F6F8"/>
      <stop offset="0.5" stop-color="#F0A202"/>
      <stop offset="1" stop-color="#FF7A59"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      .o1 { animation: d1 14s ease-in-out infinite alternate; }
      .o2 { animation: d2 16s ease-in-out infinite alternate; }
      .o3 { animation: d1 18s ease-in-out infinite alternate-reverse; }
      @keyframes d1 { to { transform: translate(120px, 60px); } }
      @keyframes d2 { to { transform: translate(-140px, -50px); } }

      .in { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

      .rp { opacity: 0; animation: cyc 9s infinite both; }
      .rp.first { opacity: 1; }
      @keyframes cyc {
        0%   { opacity: 0; transform: translateY(12px); }
        6%   { opacity: 1; transform: none; }
        28%  { opacity: 1; transform: none; }
        34%  { opacity: 0; transform: translateY(-12px); }
        100% { opacity: 0; transform: translateY(-12px); }
      }

      .fl1 { animation: fl 5s ease-in-out infinite alternate; }
      .fl2 { animation: fl 6.5s ease-in-out infinite alternate-reverse; }
      @keyframes fl { from { transform: translateY(-6px); } to { transform: translateY(8px); } }

      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .o1, .o2, .o3, .fl1, .fl2, .cur { animation: none; }
        .in { animation: none; opacity: 1; }
        .rp { animation: none; opacity: 0; }
        .rp.first { opacity: 1; }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="400" rx="20" fill="#0B1220"/>
  <g clip-path="url(#frame)">
    <g filter="url(#blur)">
      <circle class="o1" cx="180" cy="80" r="150" fill="#F0A202" fill-opacity="0.30"/>
      <circle class="o2" cx="860" cy="340" r="180" fill="#3B6CFF" fill-opacity="0.32"/>
      <circle class="o3" cx="520" cy="430" r="120" fill="#2DD4BF" fill-opacity="0.16"/>
    </g>
    <rect width="1000" height="400" fill="url(#grid)" mask="url(#gridmask)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="399" rx="19.5" fill="none" stroke="#24385F"/>

  <!-- availability badge -->
  <g class="in" style="animation-delay:.05s">
    <rect x="40" y="40" width="250" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="60" cy="57" r="4" fill="#F0A202"/>
    <circle cx="60" cy="57" r="4" fill="none" stroke="#F0A202">
      <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="62" class="sans" font-size="14" fill="#C5CEDF">Open to full-stack roles</text>
  </g>

  <!-- name -->
  <text x="40" y="172" class="sans in" font-size="84" font-weight="800" letter-spacing="-3" fill="url(#gt)" style="animation-delay:.2s">Aamir Ullah</text>

  <!-- rotating role -->
  <g class="sans" font-size="30" font-weight="500" fill="#F5F6F8">
    <text x="42" y="226" class="rp first" style="animation-delay:.6s">Full-stack developer</text>
    <text x="42" y="226" class="rp" style="animation-delay:3.6s">MERN stack engineer</text>
    <text x="42" y="226" class="rp" style="animation-delay:6.6s">API integration and automation</text>
  </g>

  <text x="42" y="268" class="sans in" font-size="17" fill="#9AA8C4" style="animation-delay:.5s">React, Node.js, Express and MongoDB.</text>

  <g class="in" style="animation-delay:.65s">
    <rect x="40" y="306" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="125" y="328" class="sans" font-size="14" fill="#F5F6F8" text-anchor="middle">Peshawar, Pakistan</text>
    <rect x="222" y="306" width="190" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="317" y="328" class="sans" font-size="14" fill="#F5F6F8" text-anchor="middle">Remote or relocation</text>
  </g>

  <!-- code card -->
  <g class="in" style="animation-delay:.4s">
    <rect x="610" y="64" width="350" height="280" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="634" cy="86" r="5" fill="#FF7A59"/>
    <circle cx="652" cy="86" r="5" fill="#F0A202"/>
    <circle cx="670" cy="86" r="5" fill="#2DD4BF"/>
    <text x="700" y="90" class="mono" font-size="13" fill="#9AA8C4">dev.ts</text>
    <path d="M610 106H960" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>

  <g class="mono" font-size="15" xml:space="preserve">
    <text x="634" y="134" class="in" style="animation-delay:.9s"><tspan fill="#F0A202">const</tspan><tspan fill="#F5F6F8"> dev = {</tspan></text>
    <text x="652" y="160" class="in" style="animation-delay:1.15s"><tspan fill="#F5F6F8">name: </tspan><tspan fill="#9FD6C4">"Aamir Ullah"</tspan><tspan fill="#C5CEDF">,</tspan></text>
    <text x="652" y="186" class="in" style="animation-delay:1.4s"><tspan fill="#F5F6F8">focus: </tspan><tspan fill="#9FD6C4">"Full-stack"</tspan><tspan fill="#C5CEDF">,</tspan></text>
    <text x="652" y="212" class="in" style="animation-delay:1.65s"><tspan fill="#F5F6F8">stack: </tspan><tspan fill="#9FD6C4">"MERN"</tspan><tspan fill="#C5CEDF">,</tspan></text>
    <text x="652" y="238" class="in" style="animation-delay:1.9s"><tspan fill="#F5F6F8">certified: </tspan><tspan fill="#F0A202">true</tspan><tspan fill="#C5CEDF">,</tspan></text>
    <text x="652" y="264" class="in" style="animation-delay:2.15s"><tspan fill="#F5F6F8">openToWork: </tspan><tspan fill="#F0A202">true</tspan><tspan fill="#C5CEDF">,</tspan></text>
    <text x="634" y="290" class="in" style="animation-delay:2.4s"><tspan fill="#F5F6F8">};</tspan></text>
    <text x="634" y="322" class="in" style="animation-delay:2.7s"><tspan fill="#F0A202">$</tspan><tspan fill="#F5F6F8"> npm run ship</tspan></text>
  </g>
  <rect class="cur" x="766" y="309" width="9" height="17" fill="#F0A202"/>

  <!-- floating chips -->
  <g class="fl1">
    <g class="in" style="animation-delay:1s">
      <rect x="540" y="338" width="96" height="38" rx="19" fill="#121F3A" stroke="#3B6CFF" stroke-opacity="0.7"/>
      <circle cx="560" cy="357" r="4" fill="#3B6CFF"/>
      <text x="604" y="362" class="sans" font-size="15" font-weight="600" fill="#F5F6F8" text-anchor="middle">React</text>
    </g>
  </g>
  <g class="fl2">
    <g class="in" style="animation-delay:1.2s">
      <rect x="868" y="44" width="108" height="38" rx="19" fill="#121F3A" stroke="#2DD4BF" stroke-opacity="0.7"/>
      <circle cx="888" cy="63" r="4" fill="#2DD4BF"/>
      <text x="934" y="68" class="sans" font-size="15" font-weight="600" fill="#F5F6F8" text-anchor="middle">Node.js</text>
    </g>
  </g>
</svg>
