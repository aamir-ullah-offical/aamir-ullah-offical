<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">Experience</title>
  <desc id="d">Timeline: MERN Stack Development Intern at IT Artificier for 3 months, and Web Development Intern at Abasyn University for 2 months.</desc>

  <defs>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .draw { stroke-dasharray: 148; stroke-dashoffset: 148; animation: draw 1.6s ease-out .3s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .in { animation: up .7s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .draw { animation: none; stroke-dashoffset: 0; }
        .in { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- timeline rail -->
  <path d="M48 86V234" stroke="#24385F" stroke-width="2"/>
  <path class="draw" d="M48 86V234" stroke="#F0A202" stroke-width="2"/>

  <!-- entry 1 -->
  <g class="sans in" style="animation-delay:.2s">
    <rect x="96" y="24" width="880" height="124" rx="18" fill="#0F1A30" stroke="#24385F"/>
    <text x="128" y="70" font-size="24" font-weight="700" fill="#F5F6F8">MERN Stack Development Intern</text>
    <text x="128" y="100" font-size="17" font-weight="600" fill="#F0A202">IT Artificier</text>
    <text x="128" y="128" font-size="15" fill="#9AA8C4">Full-stack work with MongoDB, Express, React and Node.js.</text>
    <rect x="836" y="46" width="116" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#24385F"/>
    <text x="894" y="67" font-size="14" fill="#F5F6F8" text-anchor="middle">3 months</text>
  </g>
  <circle cx="48" cy="86" r="8" fill="#F0A202"/>
  <circle cx="48" cy="86" r="8" fill="none" stroke="#F0A202">
    <animate attributeName="r" values="8;18;8" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- entry 2 -->
  <g class="sans in" style="animation-delay:.5s">
    <rect x="96" y="172" width="880" height="124" rx="18" fill="#0F1A30" stroke="#24385F"/>
    <text x="128" y="218" font-size="24" font-weight="700" fill="#F5F6F8">Web Development Intern</text>
    <text x="128" y="248" font-size="17" font-weight="600" fill="#F0A202">Abasyn University</text>
    <text x="128" y="276" font-size="15" fill="#9AA8C4">Front-end and web development work.</text>
    <rect x="836" y="194" width="116" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#24385F"/>
    <text x="894" y="215" font-size="14" fill="#F5F6F8" text-anchor="middle">2 months</text>
  </g>
  <circle cx="48" cy="234" r="8" fill="#F0A202"/>
</svg>
