<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-labelledby="t">
  <title id="t">Certifications: Meta Front-End Developer, and API Integration: End-to-End Web Development, both on Coursera</title>
  <defs>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="490" y2="120" spreadMethod="reflect">
      <stop offset="0" stop-color="#24385F"/>
      <stop offset="0.5" stop-color="#F0A202"/>
      <stop offset="1" stop-color="#24385F"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="980 240" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g class="sans">
    <!-- card 1 -->
    <rect width="490" height="120" rx="18" fill="#0F1A30"/>
    <rect x="1" y="1" width="488" height="118" rx="17" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
    <circle cx="52" cy="52" r="17" fill="none" stroke="#F0A202" stroke-width="2"/>
    <path d="M45 52L50 57L59 47" fill="none" stroke="#F0A202" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 67L40 90L52 83L64 90L60 67" fill="none" stroke="#F0A202" stroke-width="1.8" stroke-linejoin="round" stroke-opacity="0.7"/>
    <text x="92" y="52" font-size="17" font-weight="700" fill="#F5F6F8">Meta Front-End Developer</text>
    <text x="92" y="82" font-size="15" font-weight="600" fill="#F0A202">Coursera</text>

    <!-- card 2 -->
    <g transform="translate(510,0)">
      <rect width="490" height="120" rx="18" fill="#0F1A30"/>
      <rect x="1" y="1" width="488" height="118" rx="17" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
      <circle cx="52" cy="52" r="17" fill="none" stroke="#F0A202" stroke-width="2"/>
      <path d="M45 52L50 57L59 47" fill="none" stroke="#F0A202" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 67L40 90L52 83L64 90L60 67" fill="none" stroke="#F0A202" stroke-width="1.8" stroke-linejoin="round" stroke-opacity="0.7"/>
      <text x="92" y="52" font-size="16" font-weight="700" fill="#F5F6F8">API Integration: End-to-End Web Development</text>
      <text x="92" y="82" font-size="15" font-weight="600" fill="#F0A202">Coursera</text>
